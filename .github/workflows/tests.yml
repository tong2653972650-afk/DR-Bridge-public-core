name: Public core verification
on: [push, pull_request]
jobs:
  integrity-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/build_manifest.py --check
      - run: python scripts/verify_release.py
      - run: python -m unittest discover -s tests -p test_release_integrity.py -v
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_manifest.py --check
      - run: python scripts/verify_release.py
      - run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[backbones]"
      - run: python -m unittest discover -s tests -v
      - run: python examples/run_demo.py --device cpu
      - run: python scripts/smoke_backbones.py --device cpu
